name: Security validation
on:
  pull_request:
    branches: ['claude/festive-albattani-sjd0d8']
  push:
    branches: ['claude/festive-albattani-sjd0d8', 'security/**']
permissions:
  contents: read
jobs:
  verify:
    name: security-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Verify API authorization and search behavior
        run: |
          node scripts/check-ltc-monthly.cjs
          node scripts/check-care-cache.cjs
          node scripts/check-care-session.cjs
          node scripts/check-facility-detail.cjs
          node scripts/check-retired-ledger.cjs
          node scripts/check-ltc-new-preview.cjs
          node scripts/security/check-api.cjs
          ./node_modules/.bin/tsc 'functions/api/[[path]].ts' --noEmit --target es2022 --lib es2022,dom --skipLibCheck --moduleResolution bundler --module esnext
      - run: npm run build
      - run: node scripts/security/check-headers.cjs
