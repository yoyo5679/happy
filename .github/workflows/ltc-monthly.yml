name: Monthly care institution additions
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: ['claude/festive-albattani-sjd0d8']
    paths:
      - '.github/workflows/ltc-monthly.yml'
      - 'scripts/ltc/run-monthly-sync.py'
      - 'scripts/ltc/record-monthly-report.py'
permissions: {}
concurrency:
  group: ltc-monthly-additions
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      id-token: write
    outputs:
      report: ${{ steps.sync.outputs.report }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Resume this month's institution additions
        id: sync
        run: |
          python3 scripts/ltc/run-monthly-sync.py
          python3 -c 'import json; print("report="+json.dumps(json.load(open("public/ltc/monthly-update.json")),ensure_ascii=False,separators=(",",":")))' >> "$GITHUB_OUTPUT"
  record:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Record counts on the audit branch
        env:
          GH_REPORT_TOKEN: ${{ github.token }}
          MONTHLY_REPORT: ${{ needs.update.outputs.report }}
        run: python3 scripts/ltc/record-monthly-report.py
