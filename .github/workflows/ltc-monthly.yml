name: Monthly care institution additions
on:
  schedule:
    # 09:17 Asia/Seoul. Completed months exit immediately; interrupted runs resume next day.
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: ['claude/festive-albattani-sjd0d8']
    paths:
      - '.github/workflows/ltc-monthly.yml'
      - 'scripts/ltc/run-monthly-sync.py'
permissions:
  contents: write
  id-token: write
concurrency:
  group: ltc-monthly-additions
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Resume this month's institution additions
        run: python3 scripts/ltc/run-monthly-sync.py
      - name: Record completed update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ltc/monthly-update.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record monthly institution update'
            git pull --rebase origin claude/festive-albattani-sjd0d8
            git push origin HEAD:claude/festive-albattani-sjd0d8
          fi
