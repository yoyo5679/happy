<!-- 해피케어: 메인 아이콘 메뉴에서 하위 분류로 가던 아이콘을 분류 전체 페이지로 연결 (원본: happycare-web/imweb/home-icon-fix.html, 2026-10-28)
     메인 아이콘 메뉴(커스텀 위젯 kw-imgmenu)의 '성인용 보행기'가 워커(/walker, 2개)만, '안전손잡이'가 기둥형(/grab-bar-pole, 15개)만 보여 줬음.
     상위 분류 페이지(/walker-all 32개, /grab-bar 89개)로 바꿈. 요실금팬티 아이콘은 이미 상위 분류(/underwear)로 가서 그대로 둠.
     커스텀 위젯은 메뉴를 shadow DOM 안에 그리므로 위젯 안쪽까지 찾음.
     디자인 모드에서 위젯 링크를 직접 고치면 이 코드는 아무 일도 하지 않음.
     주의: 이 코드에는 HTML 기호(앰퍼샌드+이름+세미콜론)를 쓰지 않습니다. -->
<script>
(function () {
  var MAP = { '/walker': '/walker-all', '/grab-bar-pole': '/grab-bar' };
  function fix(a) {
    var to = MAP[(a.getAttribute('href') || '').replace(/\/$/, '')];
    if (to) a.setAttribute('href', to);
  }
  function fixAll() {
    document.querySelectorAll('.js-custom-widget-container').forEach(function (host) {
      if (host.shadowRoot) host.shadowRoot.querySelectorAll('a.kw-imgmenu__link').forEach(fix);
    });
  }
  // 위젯이 늦게 그려지므로 몇 번 더 확인 (마우스를 올렸을 때 보이는 주소도 맞게)
  [0, 500, 1500, 3000, 6000].forEach(function (ms) { setTimeout(fixAll, ms); });
  // 누르는 순간에도 한 번 더 바꿈
  document.addEventListener('click', function (e) {
    var path = e.composedPath ? e.composedPath() : [e.target];
    for (var i = 0; i < path.length; i++) {
      var el = path[i];
      if (el.matches && el.matches('a.kw-imgmenu__link')) { fix(el); return; }
    }
  }, true);
})();
</script>
